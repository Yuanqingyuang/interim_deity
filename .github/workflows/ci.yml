name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ── 核心门禁：零依赖，必过 ──
  core:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint（语法 + 安全危险模式）
        run: node test/support/lint.mjs
      - name: Unit Tests（数值 / 存档 / 放置 / 渲染构建器基线）
        run: node test/support/run-all.mjs

  # ── 浏览器回归：Playwright，独立 job，不阻塞核心门禁 ──
  browser:
    name: Browser Regression (Playwright)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 安装浏览器测试依赖
        run: npm --prefix test/browser install
      - name: 下载 Chromium（与 playwright-core 1.63.0 同版本注册表）
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      # 静态服务必须从**游戏根目录**起（index.html 在 trainee-deity/），
      # 从仓库根起会让 /index.html 返回 404；旧版用 `curl -sf ... && echo` 探测，
      # 探测失败不影响 job 结论，于是浏览器回归长期静默跳过。
      # test/support/serve.mjs 自带「根下必须有 index.html」的前置校验，缺了会直接失败。
      - name: 启动静态服务（游戏根目录 :8080）
        run: |
          node test/support/serve.mjs 8080 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/index.html >/dev/null; then echo "server up"; exit 0; fi
            sleep 0.5
          done
          echo "::error::静态服务未就绪（index.html 不可达）"; exit 1
      - name: 运行浏览器回归（7 个测试）
        env:
          TD_OUT: ${{ runner.temp }}/td-browser-out
        run: node test/support/run-browser.mjs
      - name: 上传测试产物（截图 / 结果 JSON）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: ${{ runner.temp }}/td-browser-out
          if-no-files-found: ignore
